name: plurione

services:
  api:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-plurione}
      POSTGRES_USER: ${POSTGRES_USER:-plurione}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Completa POSTGRES_PASSWORD en .env}
      REDIS_URL: redis://redis:6379/0
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ai-worker:
    build:
      context: ./backend
    profiles: ["ai"]
    command: ["python", "-m", "app.ai.worker"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-plurione}
      POSTGRES_USER: ${POSTGRES_USER:-plurione}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Completa POSTGRES_PASSWORD en .env}
      REDIS_URL: redis://redis:6379/0
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LANGSMITH_TRACING: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mail-worker:
    build:
      context: ./backend
    profiles: ["mail"]
    command: ["python", "-m", "app.mail.worker"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-plurione}
      POSTGRES_USER: ${POSTGRES_USER:-plurione}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Completa POSTGRES_PASSWORD en .env}
      MAIL_ENABLED: "true"
      MAIL_MODE: capture
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: none
      SMTP_FROM: no-reply@plurione.invalid
      WEB_BASE_URL: ${WEB_BASE_URL:-http://127.0.0.1:5173}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.27.4
    profiles: ["mail"]
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plurione}
      POSTGRES_USER: ${POSTGRES_USER:-plurione}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Completa POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
